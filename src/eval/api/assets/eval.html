<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>qgate eval</title>
<style>
:root {
  color-scheme: light;
  --ink: 52, 71, 103;
  --primary: #3b91ff; --primary-dark: #1d79ed; --primary-light: #59a6ff;
  --accent-2: #ffb84d; --error: #ea0606;
  --sub: #ffffff; --main: #f1f4f8; --line: #e9ecf0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  --shadow-soft: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
  --ease: cubic-bezier(.4,0,.2,1);
  --sidebar: 248px;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: var(--main); --surface: var(--sub); --surface-2: var(--main); --surface-hover: var(--main);
  --border: var(--line); --border-strong: var(--line);
  --text: rgb(var(--ink)); --muted: rgba(var(--ink), .6); --subtle: rgba(var(--ink), .5);
  --accent: var(--primary-dark); --accent-hover: var(--primary-light); --on-accent: #ffffff;
  --danger: var(--error); --danger-hover: #c70505; --focus: var(--primary);
  --ok-bg: #e3fcef; --ok-fg: #166e43; --bad-bg: rgba(234,6,6,.1); --bad-fg: var(--error);
  --warn-bg: rgba(255,184,77,.2); --warn-fg: #8a5a00; --info-bg: rgba(59,145,255,.12); --info-fg: var(--primary-dark);
  --neutral-bg: var(--main); --neutral-fg: rgba(var(--ink), .7);
  --code-bg: var(--main); --selected: rgba(59,145,255,.1); --input-bg: rgba(241,244,248,.6);
  --banner-info-bg: rgba(59,145,255,.06); --banner-bad-bg: rgba(234,6,6,.08); --banner-warn-bg: rgba(255,184,77,.16);
  --radius: 12px; --shadow: var(--shadow-soft);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: 220, 227, 238;
    --primary: #59a6ff; --primary-dark: #6cb0ff; --primary-light: #4f9bff;
    --error: #fd9891;
    --sub: #1b212b; --main: #12161d; --line: #2b323d;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px -1px rgba(0,0,0,.5);
    --shadow-soft: 0 4px 6px -1px rgba(0,0,0,.5), 0 2px 4px -2px rgba(0,0,0,.5);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.6), 0 4px 6px -4px rgba(0,0,0,.6);
    --ok-bg: rgba(126,226,184,.14); --ok-fg: #7ee2b8; --bad-bg: rgba(253,152,145,.14); --bad-fg: #fd9891;
    --warn-bg: rgba(245,205,71,.14); --warn-fg: #f5cd47; --info-bg: rgba(89,166,255,.16); --info-fg: #85b8ff;
    --neutral-bg: rgba(255,255,255,.06); --neutral-fg: rgba(var(--ink), .7);
    --selected: rgba(89,166,255,.16); --input-bg: rgba(255,255,255,.04);
    --banner-info-bg: rgba(89,166,255,.1); --banner-bad-bg: rgba(253,152,145,.12); --banner-warn-bg: rgba(245,205,71,.1);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: 220, 227, 238;
  --primary: #59a6ff; --primary-dark: #6cb0ff; --primary-light: #4f9bff;
  --error: #fd9891;
  --sub: #1b212b; --main: #12161d; --line: #2b323d;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px -1px rgba(0,0,0,.5);
  --shadow-soft: 0 4px 6px -1px rgba(0,0,0,.5), 0 2px 4px -2px rgba(0,0,0,.5);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.6), 0 4px 6px -4px rgba(0,0,0,.6);
  --ok-bg: rgba(126,226,184,.14); --ok-fg: #7ee2b8; --bad-bg: rgba(253,152,145,.14); --bad-fg: #fd9891;
  --warn-bg: rgba(245,205,71,.14); --warn-fg: #f5cd47; --info-bg: rgba(89,166,255,.16); --info-fg: #85b8ff;
  --neutral-bg: rgba(255,255,255,.06); --neutral-fg: rgba(var(--ink), .7);
  --selected: rgba(89,166,255,.16); --input-bg: rgba(255,255,255,.04);
  --banner-info-bg: rgba(89,166,255,.1); --banner-bad-bg: rgba(253,152,145,.12); --banner-warn-bg: rgba(245,205,71,.1);
}
* { box-sizing: border-box; }
body { margin: 0; font: 300 15px/1.6 var(--sans); background: var(--main); color: rgb(var(--ink)); overflow-wrap: anywhere; }
a { color: var(--primary-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app { display: flex; align-items: flex-start; gap: 12px; min-height: 100vh; padding: 12px; }
.sidebar { flex: 0 0 var(--sidebar); width: var(--sidebar); background: var(--sub); border-radius: 24px; box-shadow: var(--shadow-soft); padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 20px; color: rgb(var(--ink)); }
.brand:hover { text-decoration: none; }
.brand .logo { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(310deg, var(--primary-dark), var(--primary-light)); display: grid; place-items: center; color: #fff; box-shadow: var(--shadow-sm); }
.brand .logo svg { width: 20px; height: 20px; display: block; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; color: rgba(var(--ink), .75); font-weight: 500; font-size: 14px; transition: background .15s var(--ease), color .15s var(--ease); }
.nav-link:hover { background: var(--main); color: rgb(var(--ink)); text-decoration: none; }
.nav-link[aria-current="page"] { background: var(--selected); color: var(--primary-dark); font-weight: 700; }
.theme-toggle { margin-top: auto; display: flex; align-items: center; gap: 8px; height: auto; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--main); color: rgba(var(--ink), .75); font: 500 14px/1 var(--sans); cursor: pointer; }
.theme-toggle:hover { background: var(--main); box-shadow: var(--shadow-sm); }
.theme-toggle svg { width: 18px; height: 18px; flex: 0 0 auto; }
.content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.page-head { background: var(--sub); border-radius: 16px; box-shadow: var(--shadow-soft); padding: 20px 22px; }
.page-head h1 { font-size: 22px; line-height: 1.2; margin: 0; font-weight: 700; }
.page-head .sub { color: rgba(var(--ink), .5); font-size: 14px; font-weight: 300; margin: 4px 0 0; }
@media (max-width: 860px) {
  .app { flex-direction: column; }
  .sidebar { width: auto; flex: 0 0 auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; border-radius: 16px; }
  .brand { padding: 4px 10px 4px 2px; }
  .theme-toggle { margin-top: 0; margin-left: auto; }
}
main { display: grid; gap: 20px; padding: 0 2px 24px; max-width: 1040px; }
section.panel { background: var(--sub); border: 0; border-radius: 16px; box-shadow: var(--shadow-soft); padding: 18px 20px; min-width: 0; }
section.panel > h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
label { display: flex; flex-direction: column; font-size: 13px; font-weight: 500; color: rgba(var(--ink), .6); gap: 4px; margin-bottom: 10px; }
input, select, textarea { font: 500 14px/1.4 var(--sans); color: rgb(var(--ink)); background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
select { height: 36px; padding: 0 12px; }
textarea { resize: vertical; font-weight: 300; }
button { font: 500 14px/1 var(--sans); color: rgb(var(--ink)); background: transparent; border: 1px solid rgba(var(--ink), .2); border-radius: 12px; height: 36px; padding: 0 16px; cursor: pointer; transition: background .15s var(--ease), box-shadow .15s var(--ease); }
button:hover { background: var(--main); }
button:disabled { opacity: .5; cursor: default; }
button.primary { border: 0; color: #fff; background: linear-gradient(310deg, var(--primary-dark), var(--primary-light)); font-weight: 600; }
button.primary:hover { box-shadow: var(--shadow-soft); }
button.ghost { border-color: var(--line); color: rgba(var(--ink), .75); }
button.danger { border: 0; background: var(--error); color: #fff; font-weight: 600; }
button.danger:hover { box-shadow: var(--shadow-soft); background: var(--danger-hover); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.chip { display: inline-flex; align-items: center; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 600; line-height: 16px; white-space: nowrap; }
.ok { background: var(--ok-bg); color: var(--ok-fg); }
.bad { background: var(--bad-bg); color: var(--bad-fg); }
.warn { background: var(--warn-bg); color: var(--warn-fg); }
.info { background: var(--info-bg); color: var(--info-fg); }
.neutral { background: var(--neutral-bg); border: 1px solid var(--line); color: var(--neutral-fg); }
.muted { color: rgba(var(--ink), .5); font-weight: 300; }
.mono { font-family: var(--mono); font-size: 12.5px; }
pre.quote { font-family: var(--mono); font-size: 12.5px; background: var(--main); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 2px 0 6px; white-space: pre-wrap; color: rgba(var(--ink), .85); }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: rgba(var(--ink), .6); margin-top: 8px; }
.empty { color: rgba(var(--ink), .5); font-style: italic; font-weight: 300; }
.banner { border-radius: 16px; padding: 14px 16px; margin: 0; font-weight: 300; }
.banner.info { background: var(--banner-info-bg); color: rgba(var(--ink), .8); }
.banner.bad { background: var(--banner-bad-bg); color: var(--error); font-weight: 500; }
.banner.warn { background: var(--banner-warn-bg); color: var(--warn-fg); font-weight: 500; }
.finding { background: var(--main); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
.finding-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
#error { background: var(--bad-bg); color: var(--bad-fg); border-radius: 16px; box-shadow: var(--shadow-soft); padding: 12px 16px; margin: 0; font-weight: 500; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { font-size: 12px; color: rgba(var(--ink), .6); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; }
td.wrap { white-space: normal; min-width: 220px; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--main); }
tr.selected td { background: var(--selected); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 12px 0; }
.stat { background: var(--main); border-radius: 12px; padding: 10px 14px; }
.stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .name { font-size: 12px; color: rgba(var(--ink), .6); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.delta-up { color: var(--ok-fg); font-weight: 600; }
.delta-down { color: var(--bad-fg); font-weight: 600; }
.stack { display: grid; gap: 10px; }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 72px; max-width: 520px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.spark .bar { flex: 1 1 0; min-width: 3px; background: var(--primary-dark); border-radius: 3px 3px 0 0; }
.spark .bar.reg { background: var(--error); }
</style>
<script>
(function(){var K="qgate-theme",O=["system","light","dark"],c="system";try{c=localStorage.getItem(K)||"system";}catch(e){}function apply(t){var r=document.documentElement;if(t==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);var b=document.getElementById("qg-theme");if(b){var l=b.querySelector(".tt-label");if(l)l.textContent=t.charAt(0).toUpperCase()+t.slice(1);}}apply(c);document.addEventListener("DOMContentLoaded",function(){apply(c);var b=document.getElementById("qg-theme");if(b)b.addEventListener("click",function(){c=O[(O.indexOf(c)+1)%3];try{localStorage.setItem(K,c);}catch(e){}apply(c);});});})();
</script>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9.2 12.2l2 2 3.6-3.8"/></svg></span>QGate</a>
  <a class="nav-link" href="/">Dashboard</a>
  <a class="nav-link" href="/repos">Repositories</a>
  <a class="nav-link" href="/settings">Settings</a>
  <a class="nav-link" href="/rulebook">Rulebook</a>
  <a class="nav-link" href="/redteam">Red team</a>
  <a class="nav-link" aria-current="page" href="/eval">Eval</a>
  <a class="nav-link" href="/policy">Policy assistant</a>
  <button type="button" class="theme-toggle" id="qg-theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><span class="tt-label">System</span></button>
</aside>
<div class="content">
<header class="page-head"><h1>Eval</h1><p class="sub">How well qgate's own reviews score against the golden set. Run <code>qgate eval</code> to add a data point.</p></header>
<p id="error" hidden role="alert"></p>
<main>
  <section class="panel" id="status-panel">
    <h2>Latest eval</h2>
    <div id="status"><p class="empty">Loading…</p></div>
  </section>
  <section class="panel" id="trend-panel" hidden>
    <h2>Trend (F1 per run)</h2>
    <div id="spark"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Model</th><th>Prompt</th><th class="num">Cases × runs</th><th class="num">Precision</th><th class="num">Recall</th><th class="num">F1</th><th class="num">AC accuracy</th><th class="num">Cost</th><th></th></tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
  </section>
  <section class="panel" id="detail-panel" hidden>
    <h2 id="detail-title">Run</h2>
    <div id="detail"></div>
  </section>
</main>
</div>
</div>
<script>
"use strict";
(() => {
  const EMPTY_TEXT = "No eval yet \u2014 run `qgate eval` (see README).";
  const SHORT_HASH = 12;
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const replace = (node, ...children) => { node.replaceChildren(); node.append(...children.flat()); };
  const chip = (text, cls) => el("span", { class: "chip " + (cls || "neutral") }, text);
  const isNum = (v) => typeof v === "number" && Number.isFinite(v);
  const pct = (v) => (isNum(v) ? (v * 100).toFixed(1) + "%" : "\u2013");
  const pctWith = (v, sd) => (isNum(v) ? pct(v) + (isNum(sd) && sd > 0 ? " \u00b1" + (sd * 100).toFixed(1) : "") : "\u2013");
  const usd = (v) => (isNum(v) ? "$" + v.toFixed(2) : "\u2013");
  const seconds = (ms) => (isNum(ms) ? (ms / 1000).toFixed(1) + "s" : "\u2013");
  const shortHash = (h) => String(h || "").slice(0, SHORT_HASH);
  const fmtTime = (t) => { const d = new Date(t); return Number.isNaN(d.getTime()) ? String(t || "") : d.toLocaleString(); };
  const list = (v) => (Array.isArray(v) ? v : []);

  function showError(message) {
    $("error").hidden = !message;
    $("error").textContent = message || "";
  }

  async function getJson(path) {
    const response = await fetch(path, { headers: { Accept: "application/json" }, credentials: "same-origin" });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    return data;
  }

  const guarded = (fn) => async (...args) => {
    try { showError(""); await fn(...args); } catch (err) { showError(err.message); }
  };

  function provenanceLine(p) {
    if (!p) return null;
    return el("span", { class: "mono" }, [p.model, "cli " + p.claude_cli_version, "prompt " + shortHash(p.prompt_hash)].join(" \u00b7 "));
  }

  function stat(name, value) {
    return el("div", { class: "stat" }, el("div", { class: "value" }, value), el("div", { class: "name" }, name));
  }

  function renderStatus(status) {
    const latest = status.latest;
    if (!latest) {
      replace($("status"), el("p", { class: "empty" }, EMPTY_TEXT));
      return;
    }
    const s = latest.summary;
    const nodes = [];
    if (status.regression) nodes.push(el("p", { class: "banner bad", role: "alert" }, "The latest eval regressed against its baseline. Open it below for what got worse."));
    if (!status.matches_current) {
      nodes.push(el("p", { class: "banner warn" }, (status.note || "no eval for the current model/prompt") + ". Run `qgate eval` to measure the current setup."));
    }
    nodes.push(el("div", { class: "stats" },
      stat("F1", pctWith(s.f1, s.f1_stddev)), stat("Precision", pct(s.precision)),
      stat("Recall", pct(s.recall)), stat("AC accuracy", pct(s.ac_accuracy))));
    nodes.push(el("div", { class: "meta" }, el("span", { class: "muted" }, fmtTime(latest.created_at)), provenanceLine(latest.provenance),
      el("span", { class: "muted" }, latest.case_count + " cases \u00d7 " + latest.runs_per_case + " run(s)")));
    replace($("status"), nodes);
  }

  function sparkline(runs) {
    const ordered = [...runs].reverse().filter((r) => isNum(r.summary.f1));
    if (ordered.length < 2) return el("p", { class: "muted" }, "A trend needs at least two runs.");
    const bars = ordered.map((r) => el("div", {
      class: "bar" + (r.regression ? " reg" : ""),
      style: "height: " + Math.max(2, Math.round(r.summary.f1 * 100)) + "%",
      title: fmtTime(r.created_at) + ": F1 " + pct(r.summary.f1),
    }));
    return el("div", { class: "spark", role: "img", "aria-label": "F1 per run, oldest to newest" }, bars);
  }

  function runRow(run, selectedId) {
    const s = run.summary;
    return el("tr", { class: "pick" + (run.id === selectedId ? " selected" : ""), tabindex: "0", onclick: guarded(() => openRun(run.id)),
        onkeydown: (e) => { if (e.key === "Enter") guarded(() => openRun(run.id))(); } },
      el("td", {}, fmtTime(run.created_at)),
      el("td", { class: "mono" }, run.provenance ? run.provenance.model : "\u2013"),
      el("td", { class: "mono" }, run.provenance ? shortHash(run.provenance.prompt_hash) : "\u2013"),
      el("td", { class: "num" }, run.case_count + " \u00d7 " + run.runs_per_case + (run.with_tests ? " +tests" : "")),
      el("td", { class: "num" }, pct(s.precision)), el("td", { class: "num" }, pct(s.recall)),
      el("td", { class: "num" }, pctWith(s.f1, s.f1_stddev)), el("td", { class: "num" }, pct(s.ac_accuracy)),
      el("td", { class: "num" }, usd(run.cost_usd)),
      el("td", {}, run.regression ? chip("regression", "bad") : null));
  }

  function renderRuns(runs, selectedId) {
    $("trend-panel").hidden = runs.length === 0;
    replace($("spark"), sparkline(runs));
    replace($("runs"), runs.map((run) => runRow(run, selectedId)));
  }

  const countsText = (c) => "TP " + c.tp + " \u00b7 FN " + c.fn + " \u00b7 FP " + c.fp + " \u00b7 unlabeled " + c.unlabeled;

  function categoryTable(byCategory) {
    const rows = Object.entries(byCategory || {}).sort(([a], [b]) => a.localeCompare(b)).map(([name, m]) =>
      el("tr", {}, el("td", {}, name), el("td", {}, countsText(m.counts)),
        el("td", { class: "num" }, pct(m.precision)), el("td", { class: "num" }, pct(m.recall)), el("td", { class: "num" }, pct(m.f1))));
    if (!rows.length) return el("p", { class: "empty" }, "No categories.");
    return el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Category"), el("th", {}, "Counts"), el("th", { class: "num" }, "Precision"), el("th", { class: "num" }, "Recall"), el("th", { class: "num" }, "F1"))),
      el("tbody", {}, rows)));
  }

  function caseRow(c) {
    const expected = list(c.expected);
    const wrongCriteria = list(c.criteria_detail).filter((d) => !d.correct);
    const crit = c.criteria;
    return el("tr", {},
      el("td", { class: "mono" }, c.case_id),
      el("td", {}, countsText(c.counts)),
      el("td", { class: "num" }, pct(c.f1)),
      el("td", { class: "num" }, crit && crit.total ? crit.correct + "/" + crit.total + " (" + pct(c.ac_accuracy) + ")" : "\u2013"),
      el("td", { class: "wrap" }, expected.length
        ? expected.map((e) => chip((e.caught ? "caught " : "missed ") + e.label, e.caught ? "ok" : "bad")) : el("span", { class: "muted" }, "none expected")),
      el("td", { class: "wrap" }, wrongCriteria.length
        ? wrongCriteria.map((d) => el("div", {}, chip("AC " + d.index, "bad"), " expected " + d.expect + ": " + d.text)) : el("span", { class: "muted" }, "all correct")),
      el("td", { class: "num" }, usd(c.cost_usd)));
  }

  function caseTable(cases) {
    if (!list(cases).length) return el("p", { class: "empty" }, "No cases.");
    return el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Case"), el("th", {}, "Counts"), el("th", { class: "num" }, "F1"), el("th", { class: "num" }, "AC correct"),
        el("th", {}, "Expected findings"), el("th", {}, "Wrong criteria"), el("th", { class: "num" }, "Cost"))),
      el("tbody", {}, cases.map(caseRow))));
  }

  function delta(value) {
    if (!isNum(value)) return el("span", { class: "muted" }, "\u2013");
    const points = value * 100;
    const text = (points > 0 ? "+" : points < 0 ? "\u2212" : "") + Math.abs(points).toFixed(1) + " pp";
    return el("span", { class: points > 0 ? "delta-up" : points < 0 ? "delta-down" : "muted" }, text);
  }

  function comparisonBlock(cmp) {
    if (!cmp) return el("p", { class: "muted" }, "No earlier run to compare with.");
    const metrics = [["Precision", "precision"], ["Recall", "recall"], ["F1", "f1"], ["AC accuracy", "ac_accuracy"]];
    const rows = metrics.map(([label, key]) => el("tr", {}, el("td", {}, label),
      el("td", { class: "num" }, pct(cmp.baseline && cmp.baseline[key])), el("td", { class: "num" }, pct(cmp.current && cmp.current[key])),
      el("td", { class: "num" }, delta(cmp.deltas && cmp.deltas[key]))));
    const nodes = [
      el("div", { class: "meta" }, cmp.regressed ? chip("regressed", "bad") : chip("no regression", "ok"),
        el("span", { class: "muted" }, "vs run #" + cmp.baseline_id + " \u00b7 max drop " + pct(cmp.max_drop))),
      el("div", { class: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Metric"), el("th", { class: "num" }, "Baseline"), el("th", { class: "num" }, "This run"), el("th", { class: "num" }, "Change"))),
        el("tbody", {}, rows))),
    ];
    const group = (title, items, cls) => (items.length
      ? el("div", {}, el("p", { class: "label" }, title), el("ul", { class: "list" }, items.map((text) => el("li", {}, chip(title, cls), " ", text)))) : null);
    nodes.push(group("Regression", list(cmp.regressions).map(String), "bad"));
    nodes.push(group("Lost catch", list(cmp.lost_catches).map((l) => l.case_id + ": " + l.label), "bad"));
    nodes.push(group("Lost criterion", list(cmp.lost_criteria).map((l) => l.case_id + " AC " + l.index + ": " + l.text), "bad"));
    nodes.push(group("Changed", list(cmp.provenance_changes).map(String), "warn"));
    nodes.push(group("Only in this run", list(cmp.only_in_current).map(String), "info"));
    nodes.push(group("Only in baseline", list(cmp.only_in_baseline).map(String), "info"));
    nodes.push(group("Note", list(cmp.notes).map(String), "neutral"));
    return el("div", { class: "stack" }, nodes);
  }

  function renderDetail(run) {
    const m = run.metrics;
    $("detail-panel").hidden = false;
    $("detail-title").textContent = "Run #" + run.id;
    replace($("detail"), el("div", { class: "stack" },
      el("div", { class: "meta" }, el("span", {}, fmtTime(run.created_at)), provenanceLine(run.provenance),
        el("span", { class: "muted" }, run.case_count + " cases \u00d7 " + run.runs_per_case + " run(s)" + (run.with_tests ? " \u00b7 with tests" : "")),
        el("span", { class: "muted" }, usd(m.cost_usd) + " \u00b7 " + seconds(m.duration_ms)),
        run.regression ? chip("regression", "bad") : null),
      el("h3", {}, "Comparison"), comparisonBlock(run.comparison),
      el("h3", {}, "By category"), categoryTable(m.by_category),
      el("h3", {}, "By case"), caseTable(m.cases)));
  }

  let runsCache = [];

  async function openRun(id) {
    const run = await getJson("/api/eval/runs/" + id);
    renderRuns(runsCache, id);
    renderDetail(run);
  }

  async function load() {
    const [status, listing] = await Promise.all([getJson("/api/eval/status"), getJson("/api/eval/runs")]);
    renderStatus(status);
    runsCache = list(listing.runs);
    renderRuns(runsCache, null);
    if (runsCache.length) await openRun(runsCache[0].id);
  }

  guarded(load)();
})();
</script>
</body>
</html>
