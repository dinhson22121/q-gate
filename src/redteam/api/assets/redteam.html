<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="qgate-token" content="__QGATE_TOKEN__">
<title>qgate red team</title>
<style>
:root {
  color-scheme: light;
  --ink: 52, 71, 103;
  --primary: #3b91ff; --primary-dark: #1d79ed; --primary-light: #59a6ff;
  --accent-2: #ffb84d; --error: #ea0606;
  --sub: #ffffff; --main: #f1f4f8; --line: #e9ecf0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  --shadow-soft: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
  --ease: cubic-bezier(.4,0,.2,1);
  --sidebar: 248px;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: var(--main); --surface: var(--sub); --surface-2: var(--main); --surface-hover: var(--main);
  --border: var(--line); --border-strong: var(--line);
  --text: rgb(var(--ink)); --muted: rgba(var(--ink), .6); --subtle: rgba(var(--ink), .5);
  --accent: var(--primary-dark); --accent-hover: var(--primary-light); --on-accent: #ffffff;
  --danger: var(--error); --danger-hover: #c70505; --focus: var(--primary);
  --ok-bg: #e3fcef; --ok-fg: #166e43; --bad-bg: rgba(234,6,6,.1); --bad-fg: var(--error);
  --warn-bg: rgba(255,184,77,.2); --warn-fg: #8a5a00; --info-bg: rgba(59,145,255,.12); --info-fg: var(--primary-dark);
  --neutral-bg: var(--main); --neutral-fg: rgba(var(--ink), .7);
  --code-bg: var(--main); --selected: rgba(59,145,255,.1); --input-bg: rgba(241,244,248,.6);
  --banner-info-bg: rgba(59,145,255,.06); --banner-bad-bg: rgba(234,6,6,.08); --banner-warn-bg: rgba(255,184,77,.16);
  --radius: 12px; --shadow: var(--shadow-soft);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: 220, 227, 238;
    --primary: #59a6ff; --primary-dark: #6cb0ff; --primary-light: #4f9bff;
    --error: #fd9891;
    --sub: #1b212b; --main: #12161d; --line: #2b323d;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px -1px rgba(0,0,0,.5);
    --shadow-soft: 0 4px 6px -1px rgba(0,0,0,.5), 0 2px 4px -2px rgba(0,0,0,.5);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.6), 0 4px 6px -4px rgba(0,0,0,.6);
    --ok-bg: rgba(126,226,184,.14); --ok-fg: #7ee2b8; --bad-bg: rgba(253,152,145,.14); --bad-fg: #fd9891;
    --warn-bg: rgba(245,205,71,.14); --warn-fg: #f5cd47; --info-bg: rgba(89,166,255,.16); --info-fg: #85b8ff;
    --neutral-bg: rgba(255,255,255,.06); --neutral-fg: rgba(var(--ink), .7);
    --selected: rgba(89,166,255,.16); --input-bg: rgba(255,255,255,.04);
    --banner-info-bg: rgba(89,166,255,.1); --banner-bad-bg: rgba(253,152,145,.12); --banner-warn-bg: rgba(245,205,71,.1);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: 220, 227, 238;
  --primary: #59a6ff; --primary-dark: #6cb0ff; --primary-light: #4f9bff;
  --error: #fd9891;
  --sub: #1b212b; --main: #12161d; --line: #2b323d;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px -1px rgba(0,0,0,.5);
  --shadow-soft: 0 4px 6px -1px rgba(0,0,0,.5), 0 2px 4px -2px rgba(0,0,0,.5);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.6), 0 4px 6px -4px rgba(0,0,0,.6);
  --ok-bg: rgba(126,226,184,.14); --ok-fg: #7ee2b8; --bad-bg: rgba(253,152,145,.14); --bad-fg: #fd9891;
  --warn-bg: rgba(245,205,71,.14); --warn-fg: #f5cd47; --info-bg: rgba(89,166,255,.16); --info-fg: #85b8ff;
  --neutral-bg: rgba(255,255,255,.06); --neutral-fg: rgba(var(--ink), .7);
  --selected: rgba(89,166,255,.16); --input-bg: rgba(255,255,255,.04);
  --banner-info-bg: rgba(89,166,255,.1); --banner-bad-bg: rgba(253,152,145,.12); --banner-warn-bg: rgba(245,205,71,.1);
}
* { box-sizing: border-box; }
body { margin: 0; font: 300 15px/1.6 var(--sans); background: var(--main); color: rgb(var(--ink)); overflow-wrap: anywhere; }
a { color: var(--primary-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.app { display: flex; align-items: flex-start; gap: 12px; min-height: 100vh; padding: 12px; }
.sidebar { flex: 0 0 var(--sidebar); width: var(--sidebar); background: var(--sub); border-radius: 24px; box-shadow: var(--shadow-soft); padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 20px; color: rgb(var(--ink)); }
.brand:hover { text-decoration: none; }
.brand .logo { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(310deg, var(--primary-dark), var(--primary-light)); display: grid; place-items: center; color: #fff; box-shadow: var(--shadow-sm); }
.brand .logo svg { width: 20px; height: 20px; display: block; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; color: rgba(var(--ink), .75); font-weight: 500; font-size: 14px; transition: background .15s var(--ease), color .15s var(--ease); }
.nav-link:hover { background: var(--main); color: rgb(var(--ink)); text-decoration: none; }
.nav-link[aria-current="page"] { background: var(--selected); color: var(--primary-dark); font-weight: 700; }
.theme-toggle { margin-top: auto; display: flex; align-items: center; gap: 8px; height: auto; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--main); color: rgba(var(--ink), .75); font: 500 14px/1 var(--sans); cursor: pointer; }
.theme-toggle:hover { background: var(--main); box-shadow: var(--shadow-sm); }
.theme-toggle svg { width: 18px; height: 18px; flex: 0 0 auto; }
.content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.page-head { background: var(--sub); border-radius: 16px; box-shadow: var(--shadow-soft); padding: 20px 22px; }
.page-head h1 { font-size: 22px; line-height: 1.2; margin: 0; font-weight: 700; }
.page-head .sub { color: rgba(var(--ink), .5); font-size: 14px; font-weight: 300; margin: 4px 0 0; }
@media (max-width: 860px) {
  .app { flex-direction: column; }
  .sidebar { width: auto; flex: 0 0 auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; border-radius: 16px; }
  .brand { padding: 4px 10px 4px 2px; }
  .theme-toggle { margin-top: 0; margin-left: auto; }
}
main { display: grid; gap: 20px; padding: 0 2px 24px; max-width: 1040px; }
section.panel { background: var(--sub); border: 0; border-radius: 16px; box-shadow: var(--shadow-soft); padding: 18px 20px; min-width: 0; }
section.panel > h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
label { display: flex; flex-direction: column; font-size: 13px; font-weight: 500; color: rgba(var(--ink), .6); gap: 4px; margin-bottom: 10px; }
input, select, textarea { font: 500 14px/1.4 var(--sans); color: rgb(var(--ink)); background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
select { height: 36px; padding: 0 12px; }
textarea { resize: vertical; font-weight: 300; }
button { font: 500 14px/1 var(--sans); color: rgb(var(--ink)); background: transparent; border: 1px solid rgba(var(--ink), .2); border-radius: 12px; height: 36px; padding: 0 16px; cursor: pointer; transition: background .15s var(--ease), box-shadow .15s var(--ease); }
button:hover { background: var(--main); }
button:disabled { opacity: .5; cursor: default; }
button.primary { border: 0; color: #fff; background: linear-gradient(310deg, var(--primary-dark), var(--primary-light)); font-weight: 600; }
button.primary:hover { box-shadow: var(--shadow-soft); }
button.ghost { border-color: var(--line); color: rgba(var(--ink), .75); }
button.danger { border: 0; background: var(--error); color: #fff; font-weight: 600; }
button.danger:hover { box-shadow: var(--shadow-soft); background: var(--danger-hover); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.chip { display: inline-flex; align-items: center; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 600; line-height: 16px; white-space: nowrap; }
.ok { background: var(--ok-bg); color: var(--ok-fg); }
.bad { background: var(--bad-bg); color: var(--bad-fg); }
.warn { background: var(--warn-bg); color: var(--warn-fg); }
.info { background: var(--info-bg); color: var(--info-fg); }
.neutral { background: var(--neutral-bg); border: 1px solid var(--line); color: var(--neutral-fg); }
.muted { color: rgba(var(--ink), .5); font-weight: 300; }
.mono { font-family: var(--mono); font-size: 12.5px; }
pre.quote { font-family: var(--mono); font-size: 12.5px; background: var(--main); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 2px 0 6px; white-space: pre-wrap; color: rgba(var(--ink), .85); }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: rgba(var(--ink), .6); margin-top: 8px; }
.empty { color: rgba(var(--ink), .5); font-style: italic; font-weight: 300; }
.banner { border-radius: 16px; padding: 14px 16px; margin: 0; font-weight: 300; }
.banner.info { background: var(--banner-info-bg); color: rgba(var(--ink), .8); }
.banner.bad { background: var(--banner-bad-bg); color: var(--error); font-weight: 500; }
.banner.warn { background: var(--banner-warn-bg); color: var(--warn-fg); font-weight: 500; }
.finding { background: var(--main); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
.finding-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
#error { background: var(--bad-bg); color: var(--bad-fg); border-radius: 16px; box-shadow: var(--shadow-soft); padding: 12px 16px; margin: 0; font-weight: 500; }
</style>
<script>
(function(){var K="qgate-theme",O=["system","light","dark"],c="system";try{c=localStorage.getItem(K)||"system";}catch(e){}function apply(t){var r=document.documentElement;if(t==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);var b=document.getElementById("qg-theme");if(b){var l=b.querySelector(".tt-label");if(l)l.textContent=t.charAt(0).toUpperCase()+t.slice(1);}}apply(c);document.addEventListener("DOMContentLoaded",function(){apply(c);var b=document.getElementById("qg-theme");if(b)b.addEventListener("click",function(){c=O[(O.indexOf(c)+1)%3];try{localStorage.setItem(K,c);}catch(e){}apply(c);});});})();
</script>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9.2 12.2l2 2 3.6-3.8"/></svg></span>QGate</a>
  <a class="nav-link" href="/">Dashboard</a>
  <a class="nav-link" href="/repos">Repositories</a>
  <a class="nav-link" href="/settings">Settings</a>
  <a class="nav-link" href="/rulebook">Rulebook</a>
  <a class="nav-link" aria-current="page" href="/redteam">Red team</a>
  <a class="nav-link" href="/eval">Eval</a>
  <a class="nav-link" href="/policy">Policy assistant</a>
  <button type="button" class="theme-toggle" id="qg-theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><span class="tt-label">System</span></button>
</aside>
<div class="content">
<header class="page-head"><h1>Red team</h1><p class="sub">On-demand black-box pentest of an already-running app (dev or isolated on-prem only).</p></header>
<p id="error" hidden role="alert"></p>
<main>
  <section class="panel">
    <h2>New scan</h2>
    <form id="scan-form">
      <div class="row">
        <label>Base URL
          <input id="base_url" type="text" placeholder="http://127.0.0.1:8080" required>
        </label>
        <label>Health path
          <input id="health_path" type="text" placeholder="/">
        </label>
      </div>
      <div class="row">
        <label>Auth
          <select id="auth_kind">
            <option value="none">None</option>
            <option value="bearer">Bearer token</option>
            <option value="login">Login (POST url + username/password)</option>
          </select>
        </label>
        <label id="bearer_row" hidden>Token
          <input id="bearer_token" type="password">
        </label>
        <label id="login_url_row" hidden>Login URL
          <input id="login_url" type="text">
        </label>
        <label id="login_user_row" hidden>Username
          <input id="login_username" type="text">
        </label>
        <label id="login_pass_row" hidden>Password
          <input id="login_password" type="password">
        </label>
      </div>
      <label style="flex-direction: row; align-items: center; gap: 6px;">
        <input id="allow_destructive" type="checkbox">
        Allow destructive PoCs (only honored when this target is flagged isolated/disposable in settings)
      </label>
      <button type="submit" class="danger" id="run">Run pentest</button>
    </form>
  </section>
  <section class="panel" id="result-panel" hidden>
    <h2>Latest scan</h2>
    <div id="result"></div>
  </section>
  <section class="panel">
    <h2>Recent scans</h2>
    <div id="recent"><p class="empty">Loading…</p></div>
  </section>
</main>
</div>
</div>
<script>
"use strict";
(() => {
  const TOKEN = document.querySelector('meta[name="qgate-token"]').content;
  const RELOAD_HINT = "qgate restarted or the page is stale: reload the page.";
  const HEADERS = { "Content-Type": "application/json", "X-Qgate-Request": "redteam", "X-Qgate-Token": TOKEN, Accept: "application/json" };
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const replace = (node, ...children) => { node.replaceChildren(); node.append(...children.flat()); };
  const chip = (text, cls) => el("span", { class: "chip " + (cls || "neutral") }, text);
  const sevClass = (s) => (s === "critical" ? "bad" : "warn");

  function showError(message) {
    $("error").hidden = !message;
    $("error").textContent = message || "";
  }

  async function call(method, path, body) {
    const options = { method, credentials: "same-origin", headers: method === "GET" ? { Accept: "application/json" } : HEADERS };
    if (method !== "GET") options.body = JSON.stringify(body || {});
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (response.status === 401) throw new Error(RELOAD_HINT);
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    return data;
  }

  const guarded = (fn) => async (...args) => {
    try { showError(""); await fn(...args); } catch (err) { showError(err.message); }
  };

  $("auth_kind").addEventListener("change", () => {
    const kind = $("auth_kind").value;
    $("bearer_row").hidden = kind !== "bearer";
    for (const id of ["login_url_row", "login_user_row", "login_pass_row"]) $(id).hidden = kind !== "login";
  });

  function buildTarget() {
    const target = { base_url: $("base_url").value.trim(), allow_destructive: $("allow_destructive").checked };
    const healthPath = $("health_path").value.trim();
    if (healthPath) target.health_path = healthPath;
    const kind = $("auth_kind").value;
    if (kind === "bearer") target.auth = { type: "bearer", token: $("bearer_token").value };
    if (kind === "login") {
      target.auth = { type: "login", url: $("login_url").value.trim(), username: $("login_username").value, password: $("login_password").value };
    }
    return target;
  }

  function renderFinding(finding) {
    return el("li", { class: "finding" },
      el("div", { class: "finding-head" },
        chip(finding.severity, sevClass(finding.severity)),
        el("strong", {}, finding.category),
        el("span", { class: "mono muted" }, finding.endpoint.method + " " + finding.endpoint.path)),
      el("p", {}, finding.impact),
      el("p", { class: "label" }, "Proof of concept"),
      el("pre", { class: "quote" }, finding.poc.request + "\n" + finding.poc.response_evidence),
      el("p", { class: "label" }, "Reproduce"),
      el("pre", { class: "quote" }, finding.poc.reproduce),
      el("p", { class: "label" }, "Fix"),
      el("p", {}, finding.fix),
      el("p", { class: "label" }, "Prevention rule"),
      el("p", {}, finding.rule.text));
  }

  function renderResult(report) {
    $("result-panel").hidden = false;
    const statusCls = report.status === "completed" ? "ok" : report.status === "timed_out" ? "warn" : "bad";
    const nodes = [
      el("div", { class: "finding-head" },
        chip(report.status, statusCls),
        el("span", { class: "mono muted" }, report.target.base_url),
        el("span", { class: "muted" }, report.findings.length + " finding(s), " + report.http_requests + " request(s), " + report.model_calls + " model call(s)")),
    ];
    if (report.notes.length) nodes.push(el("p", { class: "muted" }, report.notes.join(" · ")));
    nodes.push(report.findings.length
      ? el("ul", { class: "list" }, report.findings.map(renderFinding))
      : el("p", { class: "empty" }, "No proven findings."));
    replace($("result"), nodes);
  }

  function renderRecent(scans) {
    const rows = scans.map((s) => el("li", {},
      el("span", { class: "mono" }, s.target.base_url), " ",
      chip(s.status, s.status === "completed" ? "ok" : s.status === "timed_out" ? "warn" : "bad"), " ",
      el("span", { class: "muted" }, s.findings.length + " finding(s)"), " ",
      el("button", { type: "button", onclick: guarded(async () => renderResult(await call("GET", "/api/redteam/scans/" + s.id))) }, "View")));
    replace($("recent"), rows.length ? el("ul", { class: "list" }, rows) : el("p", { class: "empty" }, "No scans yet."));
  }

  async function loadRecent() {
    const { scans } = await call("GET", "/api/redteam/scans");
    renderRecent(scans);
  }

  $("scan-form").addEventListener("submit", guarded(async (event) => {
    event.preventDefault();
    $("run").disabled = true;
    try {
      const report = await call("POST", "/api/redteam/scan", buildTarget());
      renderResult(report);
      await loadRecent();
    } finally {
      $("run").disabled = false;
    }
  }));

  guarded(loadRecent)();
})();
</script>
</body>
</html>
