<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="qgate-token" content="__QGATE_TOKEN__">
<title>qgate red team</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f8f9; --surface: #ffffff; --surface-2: #f1f2f4; --surface-hover: #ebecf0;
  --border: #dfe1e6; --border-strong: #c1c7d0;
  --text: #172b4d; --muted: #44546f; --subtle: #626f86;
  --accent: #0c66e4; --accent-hover: #0055cc; --on-accent: #ffffff;
  --danger: #c9372c; --danger-hover: #ae2a19; --focus: #4c9aff;
  --ok-bg: #dcfff1; --ok-fg: #216e4e; --bad-bg: #ffecea; --bad-fg: #ae2a19;
  --warn-bg: #fff7d6; --warn-fg: #7f5f01; --info-bg: #e9f2ff; --info-fg: #0055cc;
  --neutral-bg: #dfe1e6; --neutral-fg: #44546f;
  --code-bg: #f1f2f4; --selected: #e9f2ff;
  --radius: 6px; --sidebar: 240px;
  --shadow: 0 1px 1px rgba(9,30,66,.25), 0 0 1px rgba(9,30,66,.13);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a1d; --surface: #22272b; --surface-2: #1d2125; --surface-hover: #2c333a;
    --border: #2c333a; --border-strong: #454f59;
    --text: #c7d1db; --muted: #9fadbc; --subtle: #8c9bab;
    --accent: #579dff; --accent-hover: #85b8ff; --on-accent: #1d2125;
    --danger: #f87168; --danger-hover: #fd9891; --focus: #85b8ff;
    --ok-bg: #164b35; --ok-fg: #7ee2b8; --bad-bg: #5d1f1a; --bad-fg: #fd9891;
    --warn-bg: #533f04; --warn-fg: #f5cd47; --info-bg: #09326c; --info-fg: #85b8ff;
    --neutral-bg: #2c333a; --neutral-fg: #9fadbc;
    --code-bg: #1d2125; --selected: #09326c;
    --shadow: 0 1px 1px rgba(3,4,4,.5), 0 0 1px rgba(3,4,4,.4);
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 var(--sans); background: var(--bg); color: var(--text); overflow-wrap: anywhere; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { display: flex; min-height: 100vh; align-items: stretch; }
.sidebar { flex: 0 0 var(--sidebar); width: var(--sidebar); background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; color: var(--text); }
.brand:hover { color: var(--text); text-decoration: none; }
.brand .logo { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #fff; }
.brand .logo svg { width: 18px; height: 18px; display: block; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--muted); font-weight: 500; font-size: 13.5px; }
.nav-link:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); text-decoration: none; }
.nav-link[aria-current="page"] { background: var(--selected); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.page-head { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 28px; }
.page-head h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -.015em; }
.page-head .sub { color: var(--subtle); font-size: 13px; margin: 3px 0 0; }
@media (max-width: 860px) {
  .app { flex-direction: column; }
  .sidebar { width: auto; flex: 0 0 auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand { padding: 2px 10px 2px 2px; }
  .page-head { padding: 14px 16px; }
}
main { display: grid; gap: 16px; padding: 20px 28px; max-width: 1040px; margin: 0; width: 100%; }
section.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; min-width: 0; box-shadow: var(--shadow); }
section.panel > h2 { font-size: 15px; margin: 0 0 10px; }
label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; margin-bottom: 8px; }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; }
textarea { resize: vertical; }
button { cursor: pointer; }
button:hover { background: var(--surface-2); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
button.danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.finding { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin: 8px 0; background: var(--surface-2); }
.finding-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600; line-height: 20px; white-space: nowrap; }
.ok { background: var(--ok-bg); color: var(--ok-fg); }
.bad { background: var(--bad-bg); color: var(--bad-fg); }
.warn { background: var(--warn-bg); color: var(--warn-fg); }
.info { background: var(--info-bg); color: var(--info-fg); }
.neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
pre.quote { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 2px 0 6px; white-space: pre-wrap; }
.label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 6px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 6px 0; border-top: 1px solid var(--border); }
.list li:first-child { border-top: none; }
.empty { color: var(--muted); }
#error { background: var(--bad-bg); color: var(--bad-fg); border-radius: var(--radius); padding: 8px 12px; margin: 0 20px; }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9.2 12.2l2 2 3.6-3.8"/></svg></span>QGate</a>
  <a class="nav-link" href="/">Dashboard</a>
  <a class="nav-link" href="/repos">Repositories</a>
  <a class="nav-link" href="/settings">Settings</a>
  <a class="nav-link" href="/rulebook">Rulebook</a>
  <a class="nav-link" aria-current="page" href="/redteam">Red team</a>
  <a class="nav-link" href="/policy">Policy assistant</a>
</aside>
<div class="content">
<header class="page-head"><h1>Red team</h1><p class="sub">On-demand black-box pentest of an already-running app (dev or isolated on-prem only).</p></header>
<p id="error" hidden role="alert"></p>
<main>
  <section class="panel">
    <h2>New scan</h2>
    <form id="scan-form">
      <div class="row">
        <label>Base URL
          <input id="base_url" type="text" placeholder="http://127.0.0.1:8080" required>
        </label>
        <label>Health path
          <input id="health_path" type="text" placeholder="/">
        </label>
      </div>
      <div class="row">
        <label>Auth
          <select id="auth_kind">
            <option value="none">None</option>
            <option value="bearer">Bearer token</option>
            <option value="login">Login (POST url + username/password)</option>
          </select>
        </label>
        <label id="bearer_row" hidden>Token
          <input id="bearer_token" type="password">
        </label>
        <label id="login_url_row" hidden>Login URL
          <input id="login_url" type="text">
        </label>
        <label id="login_user_row" hidden>Username
          <input id="login_username" type="text">
        </label>
        <label id="login_pass_row" hidden>Password
          <input id="login_password" type="password">
        </label>
      </div>
      <label style="flex-direction: row; align-items: center; gap: 6px;">
        <input id="allow_destructive" type="checkbox">
        Allow destructive PoCs (only honored when this target is flagged isolated/disposable in settings)
      </label>
      <button type="submit" class="danger" id="run">Run pentest</button>
    </form>
  </section>
  <section class="panel" id="result-panel" hidden>
    <h2>Latest scan</h2>
    <div id="result"></div>
  </section>
  <section class="panel">
    <h2>Recent scans</h2>
    <div id="recent"><p class="empty">Loading…</p></div>
  </section>
</main>
</div>
</div>
<script>
"use strict";
(() => {
  const TOKEN = document.querySelector('meta[name="qgate-token"]').content;
  const RELOAD_HINT = "qgate restarted or the page is stale: reload the page.";
  const HEADERS = { "Content-Type": "application/json", "X-Qgate-Request": "redteam", "X-Qgate-Token": TOKEN, Accept: "application/json" };
  const $ = (id) => document.getElementById(id);

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const replace = (node, ...children) => { node.replaceChildren(); node.append(...children.flat()); };
  const chip = (text, cls) => el("span", { class: "chip " + (cls || "neutral") }, text);
  const sevClass = (s) => (s === "critical" ? "bad" : "warn");

  function showError(message) {
    $("error").hidden = !message;
    $("error").textContent = message || "";
  }

  async function call(method, path, body) {
    const options = { method, credentials: "same-origin", headers: method === "GET" ? { Accept: "application/json" } : HEADERS };
    if (method !== "GET") options.body = JSON.stringify(body || {});
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (response.status === 401) throw new Error(RELOAD_HINT);
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    return data;
  }

  const guarded = (fn) => async (...args) => {
    try { showError(""); await fn(...args); } catch (err) { showError(err.message); }
  };

  $("auth_kind").addEventListener("change", () => {
    const kind = $("auth_kind").value;
    $("bearer_row").hidden = kind !== "bearer";
    for (const id of ["login_url_row", "login_user_row", "login_pass_row"]) $(id).hidden = kind !== "login";
  });

  function buildTarget() {
    const target = { base_url: $("base_url").value.trim(), allow_destructive: $("allow_destructive").checked };
    const healthPath = $("health_path").value.trim();
    if (healthPath) target.health_path = healthPath;
    const kind = $("auth_kind").value;
    if (kind === "bearer") target.auth = { type: "bearer", token: $("bearer_token").value };
    if (kind === "login") {
      target.auth = { type: "login", url: $("login_url").value.trim(), username: $("login_username").value, password: $("login_password").value };
    }
    return target;
  }

  function renderFinding(finding) {
    return el("li", { class: "finding" },
      el("div", { class: "finding-head" },
        chip(finding.severity, sevClass(finding.severity)),
        el("strong", {}, finding.category),
        el("span", { class: "mono muted" }, finding.endpoint.method + " " + finding.endpoint.path)),
      el("p", {}, finding.impact),
      el("p", { class: "label" }, "Proof of concept"),
      el("pre", { class: "quote" }, finding.poc.request + "\n" + finding.poc.response_evidence),
      el("p", { class: "label" }, "Reproduce"),
      el("pre", { class: "quote" }, finding.poc.reproduce),
      el("p", { class: "label" }, "Fix"),
      el("p", {}, finding.fix),
      el("p", { class: "label" }, "Prevention rule"),
      el("p", {}, finding.rule.text));
  }

  function renderResult(report) {
    $("result-panel").hidden = false;
    const statusCls = report.status === "completed" ? "ok" : report.status === "timed_out" ? "warn" : "bad";
    const nodes = [
      el("div", { class: "finding-head" },
        chip(report.status, statusCls),
        el("span", { class: "mono muted" }, report.target.base_url),
        el("span", { class: "muted" }, report.findings.length + " finding(s), " + report.http_requests + " request(s), " + report.model_calls + " model call(s)")),
    ];
    if (report.notes.length) nodes.push(el("p", { class: "muted" }, report.notes.join(" · ")));
    nodes.push(report.findings.length
      ? el("ul", { class: "list" }, report.findings.map(renderFinding))
      : el("p", { class: "empty" }, "No proven findings."));
    replace($("result"), nodes);
  }

  function renderRecent(scans) {
    const rows = scans.map((s) => el("li", {},
      el("span", { class: "mono" }, s.target.base_url), " ",
      chip(s.status, s.status === "completed" ? "ok" : s.status === "timed_out" ? "warn" : "bad"), " ",
      el("span", { class: "muted" }, s.findings.length + " finding(s)"), " ",
      el("button", { type: "button", onclick: guarded(async () => renderResult(await call("GET", "/api/redteam/scans/" + s.id))) }, "View")));
    replace($("recent"), rows.length ? el("ul", { class: "list" }, rows) : el("p", { class: "empty" }, "No scans yet."));
  }

  async function loadRecent() {
    const { scans } = await call("GET", "/api/redteam/scans");
    renderRecent(scans);
  }

  $("scan-form").addEventListener("submit", guarded(async (event) => {
    event.preventDefault();
    $("run").disabled = true;
    try {
      const report = await call("POST", "/api/redteam/scan", buildTarget());
      renderResult(report);
      await loadRecent();
    } finally {
      $("run").disabled = false;
    }
  }));

  guarded(loadRecent)();
})();
</script>
</body>
</html>
