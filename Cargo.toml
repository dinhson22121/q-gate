[package]
name = "qgate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
globset = "0.4.21"
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "system-proxy"] }
rmcp = { version = "3.11.0", features = ["client", "server", "transport-child-process", "transport-streamable-http-server"] }
rpassword = "7.5.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "net", "sync", "signal", "io-util"] }
toml = "1.2.1"

[dev-dependencies]
wiremock = "0.6.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
