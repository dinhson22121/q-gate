# Copy to docker-compose.override.yml (picked up automatically by `docker compose`) and keep what you need.
# Note: ${VARS} in this file come from your shell / a .env file, NOT from qgate.env - use literal values.

services:
  qgate:
    build:
      args:
        # Bake toolchains into the image at build time with the same verified installer scripts (the build
        # fails if a download or checksum fails). Useful for CI and offline machines:
        #   docker compose build && docker compose up -d
        # A NEW qgate-toolchains volume is seeded from the image. An existing volume keeps its content, so
        # after changing this list remove it once: docker compose down && docker volume rm qgate_qgate-toolchains
        # Keep QGATE_TOOLCHAINS and the version variables in qgate.env in sync with what you bake.
        QGATE_PREINSTALL: go,java
        # Extra Debian packages, e.g. a C toolchain for Rust crates, cgo or Python C extensions.
        # QGATE_APT_PACKAGES: build-essential

    # Strictly offline: never download at start, only use what is baked in / already cached.
    # environment:
    #   QGATE_TOOLCHAINS_SKIP_INSTALL: "true"

    # Resource caps for qgate itself (tests and linters run in qgate-runner; add the same block under
    # a `qgate-runner:` service to cap those).
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 6g

    # Keep the Claude subscription token out of qgate.env with a Docker secret (token from `claude setup-token`):
    #   mkdir -p secrets && printf '%s' "$TOKEN" > secrets/claude_oauth_token && chmod 600 secrets/claude_oauth_token
    # (on Linux the file must be readable by QGATE_UID), then uncomment the lines below, clear
    # CLAUDE_CODE_OAUTH_TOKEN and set CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/secrets/claude_oauth_token in qgate.env.
    # secrets:
    #   - claude_oauth_token

    # Alternative auth: reuse the Claude Code login of this machine's user. On Linux the login is in
    # ~/.claude/.credentials.json (on macOS it is in the Keychain, so use `claude setup-token` there).
    # Tradeoff: this exposes YOUR Claude Code credentials, settings and history to the qgate container.
    # Read-only, mounted next to the container's HOME; the CLI is told to use it via CLAUDE_CONFIG_DIR.
    # environment:
    #   CLAUDE_CONFIG_DIR: /claude-host
    # volumes:
    #   - type: bind
    #     source: ${HOME}/.claude
    #     target: /claude-host
    #     read_only: true

# secrets:
#   claude_oauth_token:
#     file: ./secrets/claude_oauth_token
